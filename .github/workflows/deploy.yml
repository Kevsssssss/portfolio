name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Validate HTML
        run: npx --yes htmlhint index.html 404.html

      - name: Validate links, anchors, and images
        run: node tools/check.mjs

      - name: Check required files
        run: |
          set -e
          for f in index.html 404.html style.css script.js; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

      - name: Stage public files only
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html style.css script.js _site/
          if [ -d images ]; then cp -r images _site/images; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          echo "Staged files:"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
